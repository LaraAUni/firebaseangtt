<div class="cont">
  @if(!signedIn){
  <button type="button" class="butt" (click)="inpopen=!inpopen; subopen=false">Sign In</button>
  <button type="button" class="butt" (click)="subopen=!subopen; inpopen=false">Sign Up</button>
  <span>'{{userName}}'</span>}
  @else{
    <span>{{userName}}</span>
    <img class="icon" src="cogIco.png" alt="Options" (click)="optionsOp=!optionsOp">
    }
  <img class="icon" src="MapIco.png" alt="Change Game">
</div>
    @if(optionsOp){
      <form for="Options" name="optionsForm" id="optionsForm">
      <div class="infobox">
        Username: <input type="text" id="newName" name="newName" placeholder="{{userName}}">
        <button type="submit" class="buttsign">Save</button>
        <button type="button" class="buttsign" (click)="signOut()">Sign Out</button>
      </div>
    </form>
    }
  @if(inpopen || subopen){
  <form for="Login-Menu" name="signForm" id="signForm">
  <div class="infobox">
    <label for="email">Email </label>
    <input type="text" inputmode="email" id="email" name="email">
    <div><label for="password">Password </label>
    <input type="text" id="password" name="password"></div>
  @if(inpopen){
    <button type="submit" class="buttsign">Sign In</button>
  }
  @else if(subopen){
    <button type="submit" class="buttsign">Sign Up</button>
}
  </div>
  </form>
  }
