<mat-drawer-container>
  <mat-drawer-content class="page">
    <header class="barra">
      <span class="title">THIRD TRUMPET !!!</span>
      <app-login-page></app-login-page>
    </header>
    <div>
      <img class="buttonanim" src="buttonanim.png" alt="B">
      <img class="openbtn" mat-button (click)="drawer.toggle()" src="button.png" alt="B">
    </div>
    <app-my-map></app-my-map>
    <div class="recap">
      <span>Recap</span>
    </div>
  </mat-drawer-content>
  <mat-drawer  position="end" mode="side" role="directory" #drawer class="sidenav">
    <mat-list style="box-shadow: none;">
      <img class="closebtn" (click)="drawer.toggle();" src="buttonclose.png" alt="">
      <mat-expansion-panel hideToggle class="expansion">
        <mat-expansion-panel-header class="links">Agenti</mat-expansion-panel-header>
          <img class="iconbtn" src="Charas/111.png" alt="" mat-list-item (click)="showChara=1; drawer.toggle();">
      </mat-expansion-panel>
      <mat-expansion-panel hideToggle class="expansion">
        <mat-expansion-panel-header class="links">Abnormalities</mat-expansion-panel-header>
          <img class="iconbtn" src="Charas/211.png" alt="" mat-list-item  (click)="showAbno=1; drawer.toggle();">
      </mat-expansion-panel>
      <mat-expansion-panel hideToggle class="expansion">
        <mat-expansion-panel-header class="links">Armoury</mat-expansion-panel-header>
          <img class="weapbtn" src="EGOs/EGOWeaponFrostShard.png" alt="" mat-list-item (click)="showArmo=1; drawer.toggle();">
      </mat-expansion-panel>
    </mat-list>
    <label class="switch" for="lightmode-toggle">
  <input type="checkbox" id="lightmode-toggle" title="Toggle light mode">
  <span class="slider"></span>
</label>
  </mat-drawer>
</mat-drawer-container>

@if(showChara>0){
    <img class="closebtn" (click)="drawer.toggle(); showChara=0" src="buttonclose.png" alt="">
    <app-chara-sheet></app-chara-sheet>
    }
@if(showAbno>0){
    <img class="closebtn" (click)="drawer.toggle(); showAbno=0" src="buttonclose.png" alt="">
    <app-abno-sheet></app-abno-sheet>
  }
@if(showArmo>0){
    <img class="closebtn" (click)="drawer.toggle(); showArmo=0" src="buttonclose.png" alt="">
    <app-armoury></app-armoury>
    }
